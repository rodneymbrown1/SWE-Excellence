<figure><svg viewBox="0 0 760 420" role="img" aria-labelledby="sm-t sm-d" xmlns="http://www.w3.org/2000/svg">
<title id="sm-t">The gateway link state machine, from the requirements</title><desc id="sm-d">Three states: Up, Degraded, Down. Down to Up after 3 heartbeats (R1). Up to Degraded after 4 missed ticks (R2). Degraded to Down after 8 missed ticks (R3). Degraded to Up after 2 heartbeats (R4). R5: a heartbeat must always clear the missed tick count.</desc>
<defs><marker id="sm-ar" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#111"/></marker></defs>
<ellipse cx="380" cy="84" rx="78" ry="44" fill="#fff" stroke="#111" stroke-width="3.5"/><text x="380" y="92" font-size="22" font-weight="800" text-anchor="middle" fill="#111">Up</text>
<ellipse cx="110" cy="300" rx="78" ry="44" fill="#fff" stroke="#111" stroke-width="3.5"/><text x="110" y="308" font-size="22" font-weight="800" text-anchor="middle" fill="#111">Down</text>
<ellipse cx="650" cy="300" rx="78" ry="44" fill="#fff" stroke="#111" stroke-width="3.5"/><text x="650" y="308" font-size="22" font-weight="800" text-anchor="middle" fill="#111">Degraded</text>
<path d="M150,262 C 210,190 270,140 308,108" stroke="#111" stroke-width="3" fill="none" marker-end="url(#sm-ar)"/>
<path d="M436,116 C 500,160 560,215 612,262" stroke="#111" stroke-width="3" fill="none" marker-end="url(#sm-ar)"/>
<path d="M572,310 H190" stroke="#111" stroke-width="3" fill="none" marker-end="url(#sm-ar)"/>
<path d="M690,262 C 740,140 600,50 462,70" stroke="#111" stroke-width="3" fill="none" marker-end="url(#sm-ar)"/>
<text x="40" y="176" font-size="15" font-weight="700" text-anchor="start" fill="#111">R1 · 3 heartbeats</text>
<text x="528" y="146" font-size="15" font-weight="700" text-anchor="start" fill="#111">R2 · 4 missed ticks</text>
<text x="380" y="298" font-size="15" font-weight="700" text-anchor="middle" fill="#111">R3 · 8 missed ticks</text>
<text x="590" y="50" font-size="15" font-weight="700" text-anchor="start" fill="#111">R4 · 2 heartbeats</text>
<rect x="170" y="338" width="420" height="64" rx="8" fill="#e4e4e4" stroke="#111" stroke-width="2.5"/>
<text x="380" y="362" font-size="15" font-weight="800" text-anchor="middle" fill="#111">R5 · Every heartbeat, in every state,</text>
<text x="380" y="384" font-size="15" font-weight="800" text-anchor="middle" fill="#111">must reset the missed-tick count to zero.</text>
</svg><figcaption>Figure 21.1. The link state machine as the requirements describe it. Chapter 21 finds the one place where the code does not honor R5.</figcaption></figure>