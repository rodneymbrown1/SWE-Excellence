<figure><svg viewBox="0 0 760 700" role="img" aria-labelledby="pn-t pn-d" xmlns="http://www.w3.org/2000/svg">
<title id="pn-t">Pin it: find the first bad state</title><desc id="pn-d">Flow: 1 filter for the first bad state. Decision: is it bad on entry? If yes go up one stage and repeat. If no, trap the writers inside, name it in one sentence, run an experiment by changing a value by hand. Decision: did the prediction hold? Yes, go to Prove it. No, revise the card.</desc>
<defs><marker id="pn-ar" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#111"/></marker></defs>
<rect x="100" y="10" width="300" height="76" rx="9" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="250.0" y="40" font-size="18" font-weight="800" text-anchor="middle" fill="#111">1  FILTER</text>
<text x="250.0" y="64" font-size="14.5" text-anchor="middle" fill="#111">first bad state, from the Card</text>
<path d="M250,86 V114" stroke="#111" stroke-width="3" fill="none" marker-end="url(#pn-ar)"/>
<path d="M250,115.0 L400.0,168 L250,221.0 L100.0,168 Z" fill="#e4e4e4" stroke="#111" stroke-width="3"/>
<text x="250" y="174" font-size="17" font-weight="800" text-anchor="middle" fill="#111">Bad on ENTRY?</text>
<text x="262" y="236" font-size="15" font-weight="800" fill="#111">no</text>
<path d="M250,221 V256" stroke="#111" stroke-width="3" fill="none" marker-end="url(#pn-ar)"/>
<rect x="100" y="258" width="300" height="76" rx="9" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="250.0" y="288" font-size="18" font-weight="800" text-anchor="middle" fill="#111">4  TRAP</text>
<text x="250.0" y="312" font-size="14.5" text-anchor="middle" fill="#111">watch -l the data, log writers</text>
<path d="M250,334 V362" stroke="#111" stroke-width="3" fill="none" marker-end="url(#pn-ar)"/>
<rect x="100" y="364" width="300" height="76" rx="9" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="250.0" y="394" font-size="18" font-weight="800" text-anchor="middle" fill="#111">5  NAME IT</text>
<text x="250.0" y="418" font-size="14.5" text-anchor="middle" fill="#111">X is Y because line L … when C</text>
<path d="M250,440 V468" stroke="#111" stroke-width="3" fill="none" marker-end="url(#pn-ar)"/>
<rect x="100" y="470" width="300" height="76" rx="9" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="250.0" y="500" font-size="18" font-weight="800" text-anchor="middle" fill="#111">EXPERIMENT</text>
<text x="250.0" y="524" font-size="14.5" text-anchor="middle" fill="#111">set var by hand, continue</text>
<path d="M250,546 V574" stroke="#111" stroke-width="3" fill="none" marker-end="url(#pn-ar)"/>
<path d="M250,573.0 L400.0,626 L250,679.0 L100.0,626 Z" fill="#e4e4e4" stroke="#111" stroke-width="3"/>
<text x="250" y="632" font-size="17" font-weight="800" text-anchor="middle" fill="#111">Prediction held?</text>
<text x="410" y="620" font-size="15" font-weight="800" fill="#111">yes</text>
<path d="M400,626 H470" stroke="#111" stroke-width="3" fill="none" marker-end="url(#pn-ar)"/>
<rect x="472" y="588" width="270" height="76" rx="9" fill="#e4e4e4" stroke="#111" stroke-width="3"/>
<text x="607.0" y="618" font-size="18" font-weight="800" text-anchor="middle" fill="#111">STEP 6 · PROVE IT</text>
<text x="607.0" y="642" font-size="14.5" text-anchor="middle" fill="#111">change the code, re-run probes</text>
<text x="262" y="690" font-size="15" font-weight="800" fill="#111">no: revise the Card</text>
<text x="404" y="160" font-size="15" font-weight="800" fill="#111">yes</text>
<path d="M400,168 H470" stroke="#111" stroke-width="3" fill="none" marker-end="url(#pn-ar)"/>
<rect x="472" y="112" width="270" height="112" rx="9" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="607.0" y="142" font-size="18" font-weight="800" text-anchor="middle" fill="#111">GO UP ONE STAGE</text>
<text x="607.0" y="166" font-size="14.5" text-anchor="middle" fill="#111">up (frame above)</text>
<text x="607.0" y="185" font-size="14.5" text-anchor="middle" fill="#111">same question at the caller:</text>
<text x="607.0" y="204" font-size="14.5" text-anchor="middle" fill="#111">repeat step 1 there</text>
<path d="M607,112 V48 H402" stroke="#111" stroke-width="3" fill="none" marker-end="url(#pn-ar)" stroke-dasharray="9 7"/>
</svg><figcaption>Figure 15.1. Pin it. Walk back along the infection chain one stage at a time until the data is good on entry and bad on exit. Then the bad write is inside that one function.</figcaption></figure>