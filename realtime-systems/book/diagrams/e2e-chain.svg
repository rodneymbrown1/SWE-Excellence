<svg viewBox="0 0 760 300" role="img" aria-labelledby="e2e-t e2e-d" xmlns="http://www.w3.org/2000/svg"><title id="e2e-t">End-to-end latency is not the sum of response times</title><desc id="e2e-d">A sensor stage at 10 ms, a filter stage at 20 ms and a controller at 40 ms. Worst-case waits for each stage's next period (hatched) dominate the execution times (solid): 80 ms in total against 10 ms of execution.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><text x="20.0" y="22.0" font-size="13" font-weight="700" text-anchor="start" fill="#111">Worst case for a signal that appears just after a stage has read its input:</text><rect x="40.0" y="60.0" width="76.0" height="36.0" rx="0" fill="url(#hatch)" stroke="#111" stroke-width="1.6" /><rect x="116.0" y="60.0" width="15.2" height="36.0" rx="0" fill="#111" stroke="#111" stroke-width="1.6" /><text x="78.0" y="120.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">Sample  T=10</text><text x="78.0" y="136.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">wait 10</text><text x="123.6" y="54.0" font-size="11" font-weight="700" text-anchor="middle" fill="#111">run 2</text><rect x="131.2" y="60.0" width="152.0" height="36.0" rx="0" fill="url(#hatch)" stroke="#111" stroke-width="1.6" /><rect x="283.2" y="60.0" width="22.8" height="36.0" rx="0" fill="#111" stroke="#111" stroke-width="1.6" /><text x="207.2" y="120.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">Filter  T=20</text><text x="207.2" y="136.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">wait 20</text><text x="294.6" y="54.0" font-size="11" font-weight="700" text-anchor="middle" fill="#111">run 3</text><rect x="306.0" y="60.0" width="304.0" height="36.0" rx="0" fill="url(#hatch)" stroke="#111" stroke-width="1.6" /><rect x="610.0" y="60.0" width="38.0" height="36.0" rx="0" fill="#111" stroke="#111" stroke-width="1.6" /><text x="458.0" y="120.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">Control  T=40</text><text x="458.0" y="136.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">wait 40</text><text x="629.0" y="54.0" font-size="11" font-weight="700" text-anchor="middle" fill="#111">run 5</text><line x1="40.0" y1="160.0" x2="648.0" y2="160.0" stroke="#0b5d73" stroke-width="2.4" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="344.0" y="182.0" font-size="13.5" font-weight="800" text-anchor="middle" fill="#0b5d73">worst-case data age ≈ Σ (T + R) = 12 + 23 + 45 = 80 ms</text><text x="40.0" y="215.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">Hatched = waiting for the next period boundary (sampling delay).   Solid = executing (response time R).</text><text x="40.0" y="238.0" font-size="12" font-weight="400" text-anchor="start" fill="#444">Sum of response times alone: 2 + 3 + 5 = 10 ms. A design reviewed only on that number is off by 8×.</text><text x="40.0" y="262.0" font-size="12" font-weight="400" text-anchor="start" fill="#444">Faster stages shrink the wait; harmonic periods make the pattern repeat; time-stamping at the source lets consumers measure age.</text><text x="40.0" y="286.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#444">Loose bound used in this book, in the spirit of Feiertag et al. (2008); the exact value depends on phase and path semantics.</text></svg>