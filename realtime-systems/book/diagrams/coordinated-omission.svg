<svg viewBox="0 0 760 270" role="img" aria-labelledby="co-t co-d" xmlns="http://www.w3.org/2000/svg"><title id="co-t">The same system, three reported tail latencies</title><desc id="co-d">Grouped bars for p99 and max latency in milliseconds. The closed-loop tester reports p99 of 1.4 ms; the open-loop ground truth is 4,483 ms.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><rect x="250.0" y="20.0" width="470.0" height="170.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.4" /><line x1="250.0" y1="20.0" x2="250.0" y2="190.0" stroke="#e0e0e0" stroke-width="0.8"/><text x="250.0" y="206.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#111">1</text><line x1="370.5" y1="20.0" x2="370.5" y2="190.0" stroke="#e0e0e0" stroke-width="0.8"/><text x="370.5" y="206.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#111">10</text><line x1="491.0" y1="20.0" x2="491.0" y2="190.0" stroke="#e0e0e0" stroke-width="0.8"/><text x="491.0" y="206.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#111">100</text><line x1="611.5" y1="20.0" x2="611.5" y2="190.0" stroke="#e0e0e0" stroke-width="0.8"/><text x="611.5" y="206.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#111">1000</text><text x="240.0" y="56.0" font-size="12" font-weight="700" text-anchor="end" fill="#111">closed-loop (as reported)</text><rect x="250.0" y="34.0" width="17.6" height="18.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="273.6" y="48.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#111">p99 = 1.4 ms</text><rect x="250.0" y="56.0" width="445.8" height="14.0" rx="0" fill="#a8a8a8" stroke="#111" stroke-width="1.2" /><text x="689.8" y="67.0" font-size="10.5" font-weight="700" text-anchor="end" fill="#111">max 5001 ms</text><text x="240.0" y="108.0" font-size="12" font-weight="700" text-anchor="end" fill="#111">closed-loop + correction</text><rect x="250.0" y="86.0" width="439.2" height="18.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><rect x="256.0" y="88.0" width="132.0" height="14.0" rx="0" fill="#fff" stroke="none" stroke-width="0" /><text x="260.0" y="100.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#111">p99 = 4411.1 ms</text><rect x="250.0" y="108.0" width="445.8" height="14.0" rx="0" fill="#a8a8a8" stroke="#111" stroke-width="1.2" /><text x="689.8" y="119.0" font-size="10.5" font-weight="700" text-anchor="end" fill="#111">max 5001 ms</text><text x="240.0" y="160.0" font-size="12" font-weight="700" text-anchor="end" fill="#111">open-loop (ground truth)</text><rect x="250.0" y="138.0" width="440.1" height="18.0" rx="0" fill="#0b5d73" stroke="#111" stroke-width="1.6" /><rect x="256.0" y="140.0" width="132.0" height="14.0" rx="0" fill="#fff" stroke="none" stroke-width="0" /><text x="260.0" y="152.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#111">p99 = 4482.8 ms</text><rect x="250.0" y="160.0" width="445.8" height="14.0" rx="0" fill="#a8a8a8" stroke="#111" stroke-width="1.2" /><text x="689.8" y="171.0" font-size="10.5" font-weight="700" text-anchor="end" fill="#111">max 5001 ms</text><text x="485.0" y="226.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">latency (ms, log scale)</text><text x="20.0" y="264.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#444">Real run of lab H5: one 5-second stall in a 60-second test at 100 requests/s.</text></svg>