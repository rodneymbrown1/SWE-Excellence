<svg viewBox="0 0 760 330" role="img" aria-labelledby="ub-t ub-d" xmlns="http://www.w3.org/2000/svg"><title id="ub-t">Utilization bounds</title><desc id="ub-d">Chart of CPU utilization against number of tasks. A curve falls from 1.0 at one task to 0.693 for many tasks: the rate-monotonic guarantee. Above it, up to 1.0, is the region needing exact analysis. A line at 1.0 marks EDF and harmonic periods; a dashed line near 0.88 marks the typical breakdown for random sets.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><rect x="70.0" y="20.0" width="650.0" height="240.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.4" /><path d="M70.0 260.0 L720.0 260.0 L720.0 167.3 L70.0 20.0 Z" fill="url(#dots)" stroke="none" stroke-width="0"/><path d="M70.0 20.0 L104.2 102.4 L138.4 125.7 L172.6 136.7 L206.8 143.1 L241.1 147.3 L275.3 150.3 L309.5 152.5 L343.7 154.1 L377.9 155.5 L412.1 156.6 L446.3 157.5 L480.5 158.3 L514.7 158.9 L548.9 159.5 L583.2 160.0 L617.4 160.4 L651.6 160.8 L685.8 161.1 L720.0 161.5" fill="none" stroke="#0b5d73" stroke-width="3"/><rect x="67.0" y="17.0" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="101.2" y="99.4" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="135.4" y="122.7" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="169.6" y="133.7" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="203.8" y="140.1" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="238.1" y="144.3" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="272.3" y="147.3" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="306.5" y="149.5" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="340.7" y="151.1" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="374.9" y="152.5" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="409.1" y="153.6" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="443.3" y="154.5" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="477.5" y="155.3" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="511.7" y="155.9" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="545.9" y="156.5" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="580.2" y="157.0" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="614.4" y="157.4" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="648.6" y="157.8" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="682.8" y="158.1" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><rect x="717.0" y="158.5" width="6.0" height="6.0" rx="0" fill="#0b5d73" stroke="#0b5d73" stroke-width="1" /><line x1="70.0" y1="20.0" x2="720.0" y2="20.0" stroke="#111" stroke-width="2"/><text x="716.0" y="14.0" font-size="12" font-weight="700" text-anchor="end" fill="#111">1.00  EDF · harmonic periods</text><line x1="70.0" y1="77.6" x2="720.0" y2="77.6" stroke="#111" stroke-width="1.4" stroke-dasharray="6 4"/><text x="716.0" y="71.6" font-size="11.5" font-weight="400" text-anchor="end" fill="#111">≈0.88 typical for random sets (Lehoczky–Sha–Ding)</text><line x1="70.0" y1="167.3" x2="720.0" y2="167.3" stroke="#111" stroke-width="1.4" stroke-dasharray="2 3"/><text x="716.0" y="183.3" font-size="11.5" font-weight="700" text-anchor="end" fill="#0b5d73">0.693 = ln 2 : the RM guarantee for any number of tasks</text><text x="190.0" y="216.8" font-size="12" font-weight="700" text-anchor="start" fill="#111">below the curve: schedulable (guaranteed)</text><text x="220.0" y="130.4" font-size="12" font-weight="400" text-anchor="start" fill="#444">between curve and 1.0: unknown — run exact analysis</text><text x="70.0" y="278.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#111">1</text><text x="104.2" y="278.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#111">2</text><text x="138.4" y="278.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#111">3</text><text x="172.6" y="278.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#111">4</text><text x="206.8" y="278.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#111">5</text><text x="377.9" y="278.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#111">10</text><text x="720.0" y="278.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#111">20</text><text x="395.0" y="298.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">number of tasks n</text><text x="62.0" y="264.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#111">0.5</text><text x="62.0" y="216.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#111">0.6</text><text x="62.0" y="168.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#111">0.7</text><text x="62.0" y="120.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#111">0.8</text><text x="62.0" y="72.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#111">0.9</text><text x="62.0" y="24.0" font-size="11.5" font-weight="400" text-anchor="end" fill="#111">1.0</text><text x="22.0" y="140.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111" transform="rotate(-90 22.0 140.0)">CPU utilization</text><text x="70.0" y="322.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#444">Curve = n(2^(1/n) − 1): 1.000, 0.828, 0.780, 0.757, 0.743 … 0.718 at n = 10, → 0.693. (Liu &amp; Layland 1973, Theorem 5.)</text></svg>