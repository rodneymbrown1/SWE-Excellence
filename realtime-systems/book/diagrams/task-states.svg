<svg viewBox="0 0 760 310" role="img" aria-labelledby="states-t states-d" xmlns="http://www.w3.org/2000/svg"><title id="states-t">Task states (FreeRTOS)</title><desc id="states-d">State diagram. Ready to Running when scheduled; Running to Ready when preempted; Running to Blocked when it waits for time or an event; Blocked to Ready when the event occurs; Ready or Running to Suspended via suspend, and back via resume.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><rect x="300.0" y="20.0" width="160.0" height="60.0" rx="4" fill="#d6e8ee" stroke="#0b5d73" stroke-width="2.4" /><text x="380.0" y="47.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Running</text><text x="380.0" y="63.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">exactly one at a time</text><rect x="30.0" y="140.0" width="170.0" height="60.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="115.0" y="167.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Ready</text><text x="115.0" y="183.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">runnable, waiting for CPU</text><rect x="560.0" y="140.0" width="170.0" height="60.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="645.0" y="167.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Blocked</text><text x="645.0" y="183.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">waiting for time / event</text><rect x="300.0" y="230.0" width="160.0" height="56.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="380.0" y="255.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Suspended</text><text x="380.0" y="271.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">out until resumed</text><line x1="200.0" y1="150.0" x2="300.0" y2="66.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><text x="48.0" y="96.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#111">scheduler picks the</text><text x="48.0" y="111.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#111">highest-priority Ready</text><line x1="300.0" y1="40.0" x2="200.0" y2="140.0" stroke="#111" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#arr)"/><text x="206.0" y="62.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#111">preempted / slice ends</text><line x1="460.0" y1="50.0" x2="560.0" y2="140.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><text x="500.0" y="82.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#111">delay / take / receive</text><line x1="560.0" y1="185.0" x2="200.0" y2="185.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><text x="380.0" y="177.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111">time passes / event arrives</text><line x1="115.0" y1="200.0" x2="300.0" y2="252.0" stroke="#111" stroke-width="1.4" marker-end="url(#arr)"/><text x="120.0" y="240.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#111">suspend</text><line x1="380.0" y1="230.0" x2="380.0" y2="80.0" stroke="#888" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arr)"/><text x="388.0" y="212.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">resume → Ready</text><text x="30.0" y="304.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#444">Only the highest-priority Ready task runs. A task that never blocks never lets lower-priority tasks run.</text></svg>