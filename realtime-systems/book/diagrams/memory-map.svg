<svg viewBox="0 0 760 320" role="img" aria-labelledby="mm-t mm-d" xmlns="http://www.w3.org/2000/svg"><title id="mm-t">Where memory goes (RAM of a small system)</title><desc id="mm-d">A vertical bar of RAM from low to high addresses: static data, heap with task stacks and queues allocated at startup, free space reserved, and the main stack. Task stacks sit inside the heap in FreeRTOS.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><rect x="40.0" y="20.0" width="330.0" height="36.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="205.0" y="43.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">main stack (before the scheduler starts)</text><rect x="40.0" y="56.0" width="330.0" height="140.0" rx="0" fill="url(#dots)" stroke="#111" stroke-width="1.6" /><rect x="48.0" y="115.0" width="314.0" height="22.0" rx="0" fill="#fff" stroke="#111" stroke-width="1" /><text x="205.0" y="131.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">heap: tasks' stacks + TCBs + queues + buffers</text><rect x="40.0" y="196.0" width="330.0" height="60.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1.6" /><text x="205.0" y="231.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">static: .data (initialised) + .bss (zeroed)</text><rect x="40.0" y="256.0" width="330.0" height="28.0" rx="0" fill="#d6e8ee" stroke="#111" stroke-width="1.6" /><text x="205.0" y="275.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">.noinit (survives a reset: post-mortem notes)</text><text x="40.0" y="302.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">high address ↑ (top)  …  low address ↓ (bottom)</text><text x="400.0" y="50.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">Stack: per task, fixed size at creation.</text><text x="400.0" y="74.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">  Overflow corrupts the neighbour first (R6).</text><text x="400.0" y="98.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">Heap: fragmentation can fail an allocation</text><text x="400.0" y="122.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">  with plenty of total free space (R6).</text><text x="400.0" y="146.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">Static: sizes known at link time — preferred.</text><text x="400.0" y="170.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">Rule (Holzmann): no allocation after initialization.</text><text x="400.0" y="194.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">Measure: high-water marks, min-ever-free heap.</text></svg>