<svg viewBox="0 0 760 330" role="img" aria-labelledby="lc-t lc-d" xmlns="http://www.w3.org/2000/svg"><title id="lc-t">Component lifecycle</title><desc id="lc-d">State machine: Unconfigured to Inactive via configure, Inactive to Active via activate, Active to Inactive via deactivate, Inactive to Unconfigured via cleanup, any to Finalized via shutdown. Allocation happens during configure; the run loop only happens in Active.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><rect x="30.0" y="120.0" width="150.0" height="70.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="105.0" y="152.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Unconfigured</text><text x="105.0" y="168.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">constructed, no resources</text><rect x="250.0" y="120.0" width="150.0" height="70.0" rx="4" fill="#d6e8ee" stroke="#0b5d73" stroke-width="1.8" /><text x="325.0" y="152.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Inactive</text><text x="325.0" y="168.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">configured, not running</text><rect x="470.0" y="120.0" width="150.0" height="70.0" rx="4" fill="#d6e8ee" stroke="#0b5d73" stroke-width="2.6" /><text x="545.0" y="152.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Active</text><text x="545.0" y="168.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">processing, publishing</text><rect x="250.0" y="250.0" width="150.0" height="56.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="325.0" y="275.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Finalized</text><text x="325.0" y="291.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">terminal</text><line x1="180.0" y1="145.0" x2="250.0" y2="145.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><text x="215.0" y="138.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111">configure</text><line x1="400.0" y1="145.0" x2="470.0" y2="145.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><text x="435.0" y="138.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111">activate</text><line x1="470.0" y1="172.0" x2="400.0" y2="172.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><text x="435.0" y="190.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111">deactivate</text><line x1="250.0" y1="172.0" x2="180.0" y2="172.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><text x="215.0" y="190.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111">cleanup</text><line x1="325.0" y1="190.0" x2="325.0" y2="250.0" stroke="#111" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/><text x="332.0" y="224.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#111">shutdown</text><path d="M545 120 C545 70 600 70 600 120" fill="none" stroke="#b00020" stroke-width="1.6" marker-end="url(#arr)"/><text x="600.0" y="66.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#b00020">error → ErrorProcessing</text><text x="30.0" y="40.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#111">Allocate, open, subscribe  →  during configure   |   Start timers and processing  →  activate</text><text x="30.0" y="60.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#444">Stop processing, drain  →  deactivate   |   Release  →  cleanup   |   Nothing allocates in Active</text><text x="30.0" y="328.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#444">Shape follows the ROS 2 managed-node design (4 primary states, 7 transitions); other frameworks use other names for the same ideas.</text></svg>