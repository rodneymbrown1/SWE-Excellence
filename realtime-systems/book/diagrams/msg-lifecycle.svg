<svg viewBox="0 0 760 270" role="img" aria-labelledby="ml-t ml-d" xmlns="http://www.w3.org/2000/svg"><title id="ml-t">A message's life and where it can go wrong</title><desc id="ml-d">Pipeline: create, stamp, publish, route, enqueue, dequeue, process, release. Under each stage the failure modes: loss, delay, reorder, duplicate, stale.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><rect x="20.0" y="40.0" width="82.0" height="52.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="61.0" y="63.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">create</text><text x="61.0" y="78.5" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">owner?</text><line x1="102.0" y1="66.0" x2="110.0" y2="66.0" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/><rect x="110.0" y="40.0" width="82.0" height="52.0" rx="4" fill="#d6e8ee" stroke="#0b5d73" stroke-width="1.8" /><text x="151.0" y="63.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">stamp</text><text x="151.0" y="78.5" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">time, seq</text><line x1="192.0" y1="66.0" x2="200.0" y2="66.0" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/><rect x="200.0" y="40.0" width="82.0" height="52.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="241.0" y="63.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">publish</text><text x="241.0" y="78.5" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">rate</text><line x1="282.0" y1="66.0" x2="290.0" y2="66.0" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/><rect x="290.0" y="40.0" width="82.0" height="52.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="331.0" y="63.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">route</text><text x="331.0" y="78.5" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">who hears?</text><line x1="372.0" y1="66.0" x2="380.0" y2="66.0" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/><rect x="380.0" y="40.0" width="82.0" height="52.0" rx="4" fill="#d6e8ee" stroke="#0b5d73" stroke-width="1.8" /><text x="421.0" y="63.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">enqueue</text><text x="421.0" y="78.5" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">depth, policy</text><line x1="462.0" y1="66.0" x2="470.0" y2="66.0" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/><rect x="470.0" y="40.0" width="82.0" height="52.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="511.0" y="63.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">dequeue</text><text x="511.0" y="78.5" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">who is late?</text><line x1="552.0" y1="66.0" x2="560.0" y2="66.0" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/><rect x="560.0" y="40.0" width="82.0" height="52.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="601.0" y="63.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">process</text><text x="601.0" y="78.5" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">budget</text><line x1="642.0" y1="66.0" x2="650.0" y2="66.0" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/><rect x="650.0" y="40.0" width="82.0" height="52.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="691.0" y="63.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">release</text><text x="691.0" y="78.5" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">free / ack</text><line x1="421.0" y1="92.0" x2="421.0" y2="133.0" stroke="#888" stroke-width="1" stroke-dasharray="2 3"/><text x="421.0" y="145.0" font-size="11.5" font-weight="800" text-anchor="middle" fill="#b00020">LOSS</text><line x1="151.0" y1="92.0" x2="151.0" y2="133.0" stroke="#888" stroke-width="1" stroke-dasharray="2 3"/><text x="151.0" y="145.0" font-size="11.5" font-weight="800" text-anchor="middle" fill="#b00020">STALE</text><line x1="511.0" y1="92.0" x2="511.0" y2="133.0" stroke="#888" stroke-width="1" stroke-dasharray="2 3"/><text x="511.0" y="145.0" font-size="11.5" font-weight="800" text-anchor="middle" fill="#b00020">DELAY</text><line x1="331.0" y1="92.0" x2="331.0" y2="133.0" stroke="#888" stroke-width="1" stroke-dasharray="2 3"/><text x="331.0" y="145.0" font-size="11.5" font-weight="800" text-anchor="middle" fill="#b00020">REORDER / DUP</text><text x="20.0" y="170.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">LOSS at enqueue: queue full → dropped. Is the drop counted and visible?</text><text x="20.0" y="190.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">STALE at stamp: a timestamp assigned late (or by stream position) corrupts every later consumer — Ingenuity Flight 6.</text><text x="20.0" y="210.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">DELAY at dequeue: the consumer is starved by higher-priority work, or blocked on a lock.</text><text x="20.0" y="230.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">REORDER / DUPLICATE at route: several paths or retries (reliable delivery) can deliver twice or out of order.</text><text x="20.0" y="256.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#0b5d73">Rule: every arrow needs an owner, an age limit and a named behaviour when it cannot keep up.</text></svg>