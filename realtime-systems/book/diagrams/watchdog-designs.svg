<svg viewBox="0 0 760 330" role="img" aria-labelledby="wd-t wd-d" xmlns="http://www.w3.org/2000/svg"><title id="wd-t">Three ways to feed a watchdog</title><desc id="wd-d">Three panels. Left: the timer interrupt feeds the watchdog, so it is fed even if every task is dead. Middle: a low-priority task feeds it, so it detects only total starvation. Right: a supervisor feeds only if every task checked in, so any stuck task causes a reset.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><rect x="10.0" y="10.0" width="240.0" height="310.0" rx="6" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="20.0" y="32.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#111">1  Feed from the timer ISR</text><text x="20.0" y="50.0" font-size="12" font-weight="700" text-anchor="start" fill="#b00020">never detects task death</text><text x="20.0" y="304.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#444">Toyota ETCS (as testified)</text><rect x="260.0" y="10.0" width="240.0" height="310.0" rx="6" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="270.0" y="32.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#111">2  Feed from a low-priority task</text><text x="270.0" y="50.0" font-size="12" font-weight="700" text-anchor="start" fill="#b00020">detects only total starvation</text><text x="270.0" y="304.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#444">Memfault: the naive design</text><rect x="510.0" y="10.0" width="240.0" height="310.0" rx="6" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="520.0" y="32.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#111">3  Feed only if ALL tasks checked in</text><text x="520.0" y="50.0" font-size="12" font-weight="700" text-anchor="start" fill="#0b5d73">detects any stuck task</text><text x="520.0" y="304.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#444">task watchdog; AUTOSAR alive supervision</text><rect x="30.0" y="120.0" width="90.0" height="36.0" rx="4" fill="#d6e8ee" stroke="#0b5d73" stroke-width="1.8" /><text x="75.0" y="142.2" font-size="12" font-weight="700" text-anchor="middle" fill="#111">Timer ISR</text><rect x="150.0" y="120.0" width="80.0" height="36.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="190.0" y="142.2" font-size="12" font-weight="700" text-anchor="middle" fill="#111">WDT</text><line x1="120.0" y1="138.0" x2="150.0" y2="138.0" stroke="#0b5d73" stroke-width="2" marker-end="url(#arrA)"/><rect x="30.0" y="190.0" width="90.0" height="28.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="75.0" y="207.8" font-size="11" font-weight="400" text-anchor="middle" fill="#111">sensor</text><rect x="30.0" y="224.0" width="90.0" height="28.0" rx="4" fill="url(#hatch)" stroke="#111" stroke-width="1.8" /><text x="75.0" y="241.8" font-size="11" font-weight="400" text-anchor="middle" fill="#111">control</text><rect x="30.0" y="258.0" width="90.0" height="28.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="75.0" y="275.9" font-size="11" font-weight="400" text-anchor="middle" fill="#111">logger</text><text x="135.0" y="232.0" font-size="11" font-weight="700" text-anchor="start" fill="#b00020">control is dead.</text><text x="135.0" y="248.0" font-size="11" font-weight="700" text-anchor="start" fill="#b00020">Nobody asks.</text><rect x="290.0" y="120.0" width="90.0" height="36.0" rx="4" fill="#d6e8ee" stroke="#0b5d73" stroke-width="1.8" /><text x="335.0" y="141.8" font-size="11" font-weight="700" text-anchor="middle" fill="#111">low-prio task</text><rect x="410.0" y="120.0" width="80.0" height="36.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="450.0" y="142.2" font-size="12" font-weight="700" text-anchor="middle" fill="#111">WDT</text><line x1="380.0" y1="138.0" x2="410.0" y2="138.0" stroke="#0b5d73" stroke-width="2" marker-end="url(#arrA)"/><rect x="290.0" y="190.0" width="90.0" height="28.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="335.0" y="207.8" font-size="11" font-weight="400" text-anchor="middle" fill="#111">sensor</text><rect x="290.0" y="224.0" width="90.0" height="28.0" rx="4" fill="url(#hatch)" stroke="#111" stroke-width="1.8" /><text x="335.0" y="241.8" font-size="11" font-weight="400" text-anchor="middle" fill="#111">control</text><rect x="290.0" y="258.0" width="90.0" height="28.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="335.0" y="275.9" font-size="11" font-weight="400" text-anchor="middle" fill="#111">logger</text><text x="395.0" y="232.0" font-size="11" font-weight="700" text-anchor="start" fill="#b00020">It still gets CPU</text><text x="395.0" y="248.0" font-size="11" font-weight="700" text-anchor="start" fill="#b00020">→ keeps feeding.</text><rect x="530.0" y="70.0" width="80.0" height="28.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="570.0" y="87.8" font-size="11" font-weight="400" text-anchor="middle" fill="#111">sensor</text><line x1="610.0" y1="84.0" x2="640.0" y2="120.0" stroke="#0b5d73" stroke-width="1.6" marker-end="url(#arrA)"/><rect x="530.0" y="104.0" width="80.0" height="28.0" rx="4" fill="url(#hatch)" stroke="#111" stroke-width="1.8" /><text x="570.0" y="121.8" font-size="11" font-weight="400" text-anchor="middle" fill="#111">control</text><line x1="610.0" y1="118.0" x2="640.0" y2="130.0" stroke="#b00020" stroke-width="1.6" stroke-dasharray="3 3"/><rect x="530.0" y="138.0" width="80.0" height="28.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="570.0" y="155.8" font-size="11" font-weight="400" text-anchor="middle" fill="#111">logger</text><line x1="610.0" y1="152.0" x2="640.0" y2="140.0" stroke="#0b5d73" stroke-width="1.6" marker-end="url(#arrA)"/><rect x="640.0" y="110.0" width="90.0" height="40.0" rx="4" fill="#d6e8ee" stroke="#0b5d73" stroke-width="1.8" /><text x="685.0" y="127.0" font-size="11" font-weight="700" text-anchor="middle" fill="#111">Supervisor</text><text x="685.0" y="141.0" font-size="9" font-weight="400" text-anchor="middle" fill="#444">all 3 in?</text><line x1="685.0" y1="150.0" x2="685.0" y2="190.0" stroke="#b00020" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr)"/><rect x="640.0" y="190.0" width="90.0" height="36.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="685.0" y="212.2" font-size="12" font-weight="700" text-anchor="middle" fill="#111">WDT</text><text x="520.0" y="270.0" font-size="11.5" font-weight="800" text-anchor="start" fill="#0b5d73">control missing → no feed</text><text x="520.0" y="288.0" font-size="11.5" font-weight="800" text-anchor="start" fill="#0b5d73">→ reset; saved note says who.</text></svg>