<svg viewBox="0 0 760 330" role="img" aria-labelledby="cyc-t cyc-d" xmlns="http://www.w3.org/2000/svg"><title id="cyc-t">A cyclic executive and what an overrun does</title><desc id="cyc-d">Top: a major cycle of four 10 ms minor frames; task A runs every frame, B every second frame, C every fourth. Bottom: task B overruns by 6 ms in frame 2, so the next frame starts late.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><text x="20.0" y="20.0" font-size="13" font-weight="700" text-anchor="start" fill="#111">Nominal: every frame's work ends before the next frame begins</text><rect x="70.0" y="34.0" width="160.0" height="38.0" rx="0" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="3 3" /><rect x="230.0" y="34.0" width="160.0" height="38.0" rx="0" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="3 3" /><rect x="390.0" y="34.0" width="160.0" height="38.0" rx="0" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="3 3" /><rect x="550.0" y="34.0" width="160.0" height="38.0" rx="0" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="3 3" /><rect x="70.0" y="34.0" width="32.0" height="38.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="86.0" y="58.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#111">A</text><rect x="102.0" y="34.0" width="48.0" height="38.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1.6" /><text x="126.0" y="58.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#111">B</text><rect x="150.0" y="34.0" width="64.0" height="38.0" rx="0" fill="url(#dots)" stroke="#111" stroke-width="1.6" /><text x="182.0" y="58.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#111">C</text><rect x="230.0" y="34.0" width="32.0" height="38.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="246.0" y="58.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#111">A</text><rect x="390.0" y="34.0" width="32.0" height="38.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="406.0" y="58.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#111">A</text><rect x="422.0" y="34.0" width="48.0" height="38.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1.6" /><text x="446.0" y="58.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#111">B</text><rect x="550.0" y="34.0" width="32.0" height="38.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="566.0" y="58.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#111">A</text><text x="70.0" y="88.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">0 ms</text><text x="230.0" y="88.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">10 ms</text><text x="390.0" y="88.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">20 ms</text><text x="550.0" y="88.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">30 ms</text><text x="710.0" y="88.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">40 ms</text><text x="70.0" y="106.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">slack in frame:  1 ms          8 ms          5 ms          8 ms</text><text x="20.0" y="150.0" font-size="13" font-weight="700" text-anchor="start" fill="#111">Overrun: B takes 9 ms instead of 3 in frame 2</text><rect x="70.0" y="164.0" width="160.0" height="38.0" rx="0" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="3 3" /><rect x="230.0" y="164.0" width="160.0" height="38.0" rx="0" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="3 3" /><rect x="390.0" y="164.0" width="160.0" height="38.0" rx="0" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="3 3" /><rect x="550.0" y="164.0" width="160.0" height="38.0" rx="0" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="3 3" /><rect x="70.0" y="164.0" width="32.0" height="38.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="86.0" y="188.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#111">A</text><rect x="102.0" y="164.0" width="144.0" height="38.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1.6" /><text x="174.0" y="188.0" font-size="12" font-weight="800" text-anchor="middle" fill="#111">B (9 ms: overrun)</text><rect x="230.0" y="164.0" width="16.0" height="38.0" rx="0" fill="url(#hatch)" stroke="#b00020" stroke-width="1.6" /><text x="246.0" y="226.0" font-size="12" font-weight="700" text-anchor="start" fill="#b00020">frame 3 starts 1 ms late: A begins at 11 ms, not 10</text><rect x="246.0" y="164.0" width="32.0" height="38.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="262.0" y="188.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#111">A</text><text x="20.0" y="262.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#111">Everything is decided in advance, so jitter is tiny — until one task is late. The lateness pushes later work late</text><text x="20.0" y="282.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#111">(the 'domino effect'), and a new task or a rate change means re-cutting the table.</text><text x="20.0" y="312.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">Behaviour per Buttazzo (2005); Eyles (2004) calls this a 'boxcar' executive. Lab H2 runs it.</text></svg>