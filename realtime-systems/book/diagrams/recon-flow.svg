<svg viewBox="0 0 760 330" role="img" aria-labelledby="rf-t rf-d" xmlns="http://www.w3.org/2000/svg"><title id="rf-t">First hour in a new RTOS system</title><desc id="rf-d">Flowchart: build and run; read the configuration; inventory tasks, interrupts, queues and shared data; compute a timing budget; measure; then choose build, debug or understand.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><rect x="12.0" y="30.0" width="138.0" height="100.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="81.0" y="55.0" font-size="13" font-weight="800" text-anchor="middle" fill="#111">1  Run it</text><text x="81.0" y="77.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">build, flash or</text><text x="81.0" y="92.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">emulate; read</text><text x="81.0" y="106.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">the log</text><line x1="150.0" y1="80.0" x2="160.0" y2="80.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><rect x="160.0" y="30.0" width="138.0" height="100.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="229.0" y="55.0" font-size="13" font-weight="800" text-anchor="middle" fill="#111">2  Read config</text><text x="229.0" y="77.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">tick, priorities,</text><text x="229.0" y="92.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">heap, hooks,</text><text x="229.0" y="106.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">asserts</text><line x1="298.0" y1="80.0" x2="308.0" y2="80.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><rect x="308.0" y="30.0" width="138.0" height="100.0" rx="4" fill="#d6e8ee" stroke="#0b5d73" stroke-width="1.8" /><text x="377.0" y="55.0" font-size="13" font-weight="800" text-anchor="middle" fill="#111">3  Inventory</text><text x="377.0" y="77.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">tasks, ISRs,</text><text x="377.0" y="92.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">queues, shared</text><text x="377.0" y="106.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">data</text><line x1="446.0" y1="80.0" x2="456.0" y2="80.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><rect x="456.0" y="30.0" width="138.0" height="100.0" rx="4" fill="#d6e8ee" stroke="#0b5d73" stroke-width="1.8" /><text x="525.0" y="55.0" font-size="13" font-weight="800" text-anchor="middle" fill="#111">4  Budget</text><text x="525.0" y="77.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">period, deadline,</text><text x="525.0" y="92.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">budget, CPU</text><text x="525.0" y="106.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">load per task</text><line x1="594.0" y1="80.0" x2="604.0" y2="80.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><rect x="604.0" y="30.0" width="138.0" height="100.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="673.0" y="55.0" font-size="13" font-weight="800" text-anchor="middle" fill="#111">5  Measure</text><text x="673.0" y="77.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">trace, counters,</text><text x="673.0" y="92.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">high-water</text><text x="673.0" y="106.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#444">marks</text><text x="12.0" y="170.0" font-size="13" font-weight="800" text-anchor="start" fill="#111">Gates between steps:</text><text x="26.0" y="194.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">▪  After 2: can you state the scheduler policy, tick rate and number of priority levels?</text><text x="26.0" y="216.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">▪  After 3: does every task have a trigger or period, a priority, a stack size and an owner?</text><text x="26.0" y="238.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">▪  After 4: does every periodic component have a deadline and an estimated or measured budget?</text><text x="26.0" y="260.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">▪  After 5: do you have one number per requirement (p99.9, max, drops, misses) — not an average?</text><line x1="12.0" y1="288.0" x2="748.0" y2="288.0" stroke="#ccc" stroke-width="1"/><text x="12.0" y="310.0" font-size="12" font-weight="700" text-anchor="start" fill="#0b5d73">Then branch:   BUILD → component card   ·   DEBUG → symptom triage   ·   UNDERSTAND → trace one message end to end</text></svg>