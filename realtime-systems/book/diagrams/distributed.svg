<svg viewBox="0 0 760 300" role="img" aria-labelledby="dist-t dist-d" xmlns="http://www.w3.org/2000/svg"><title id="dist-t">Beyond one CPU</title><desc id="dist-d">Three nodes connected by a shared bus. Each has its own clock and its own scheduler. Messages cross the bus with arbitration delay and may be lost or delayed. A timeline shows two clocks drifting apart.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><rect x="30.0" y="30.0" width="200.0" height="70.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="130.0" y="62.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Node A (sensor)</text><text x="130.0" y="78.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">own clock · own scheduler</text><line x1="130.0" y1="100.0" x2="130.0" y2="140.0" stroke="#111" stroke-width="1.8"/><rect x="270.0" y="30.0" width="200.0" height="70.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="370.0" y="62.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Node B (control)</text><text x="370.0" y="78.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">own clock · own scheduler</text><line x1="370.0" y1="100.0" x2="370.0" y2="140.0" stroke="#111" stroke-width="1.8"/><rect x="510.0" y="30.0" width="200.0" height="70.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="610.0" y="62.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Node C (actuator)</text><text x="610.0" y="78.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">own clock · own scheduler</text><line x1="610.0" y1="100.0" x2="610.0" y2="140.0" stroke="#111" stroke-width="1.8"/><rect x="30.0" y="140.0" width="680.0" height="24.0" rx="4" fill="#d9d9d9" stroke="#111" stroke-width="1.6" /><text x="370.0" y="157.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">shared bus (e.g. CAN: lowest ID wins arbitration; a frame in flight cannot be preempted)</text><text x="30.0" y="200.0" font-size="13" font-weight="800" text-anchor="start" fill="#111">New questions that a single CPU never asked:</text><text x="44.0" y="224.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">•  Whose clock is 'now'?   Drift, offset, sync protocol (PTP / gPTP), leap seconds.</text><text x="44.0" y="244.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">•  What is the worst-case delay on the bus?   Priority + blocking by the frame in flight (CAN).</text><text x="44.0" y="264.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">•  What if a node is silent?   Heartbeats / liveliness with a lease; who decides it is dead?</text><text x="44.0" y="284.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">•  What order did things happen in?   Timestamps from different clocks are not comparable without sync (Lamport 1978).</text></svg>