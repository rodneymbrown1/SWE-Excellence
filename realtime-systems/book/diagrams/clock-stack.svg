<svg viewBox="0 0 760 330" role="img" aria-labelledby="clock-t clock-d" xmlns="http://www.w3.org/2000/svg"><title id="clock-t">From crystal to 'time' in your code</title><desc id="clock-d">Layers from the hardware oscillator through a hardware timer counter and tick interrupt up to the software tick count and application time calls, with notes on resolution and wrap-around at each layer.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><rect x="30.0" y="20.0" width="240.0" height="52.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="40.0" y="42.0" font-size="14" font-weight="800" text-anchor="start" fill="#111">Oscillator</text><text x="40.0" y="61.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#444">e.g. 25 MHz crystal / PLL</text><text x="300.0" y="52.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#111">accuracy in ppm; drifts with temperature</text><line x1="150.0" y1="72.0" x2="150.0" y2="82.0" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/><rect x="30.0" y="82.0" width="240.0" height="52.0" rx="4" fill="#d6e8ee" stroke="#0b5d73" stroke-width="1.8" /><text x="40.0" y="104.0" font-size="14" font-weight="800" text-anchor="start" fill="#111">Hardware timer / counter</text><text x="40.0" y="123.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#444">free-running, fixed width (e.g. 32-bit)</text><text x="300.0" y="114.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#111">resolution = 1 / clock;  WRAPS after 2^32 counts</text><line x1="150.0" y1="134.0" x2="150.0" y2="144.0" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/><rect x="30.0" y="144.0" width="240.0" height="52.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="40.0" y="166.0" font-size="14" font-weight="800" text-anchor="start" fill="#111">Tick interrupt (SysTick)</text><text x="40.0" y="185.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#444">fires every 1 ms (1000 Hz)</text><text x="300.0" y="176.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#111">tick = the kernel's unit of time; jitter from interrupt latency</text><line x1="150.0" y1="196.0" x2="150.0" y2="206.0" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/><rect x="30.0" y="206.0" width="240.0" height="52.0" rx="4" fill="#d6e8ee" stroke="#0b5d73" stroke-width="1.8" /><text x="40.0" y="228.0" font-size="14" font-weight="800" text-anchor="start" fill="#111">Kernel tick count</text><text x="40.0" y="247.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#444">TickType_t, 16 or 32 bits</text><text x="300.0" y="238.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#111">WRAPS: 65.5 s (16-bit @1 kHz) or 49.7 days (32-bit)</text><line x1="150.0" y1="258.0" x2="150.0" y2="268.0" stroke="#111" stroke-width="1.6" marker-end="url(#arr)"/><rect x="30.0" y="268.0" width="240.0" height="52.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="40.0" y="290.0" font-size="14" font-weight="800" text-anchor="start" fill="#111">Your code</text><text x="40.0" y="309.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#444">delay, timeout, timestamp, deadline</text><text x="300.0" y="300.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#111">compare with (now - start); never now &gt;= deadline</text></svg>