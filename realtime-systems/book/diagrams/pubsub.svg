<svg viewBox="0 0 760 330" role="img" aria-labelledby="ps-t ps-d" xmlns="http://www.w3.org/2000/svg"><title id="ps-t">Publish/subscribe with per-subscriber queues and QoS</title><desc id="ps-d">Two publishers send to a topic. Three subscribers each have their own bounded queue and QoS: one reliable with depth 10, one best-effort with depth 1, one late-joining that receives the last value (transient local).</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><rect x="20.0" y="40.0" width="150.0" height="56.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="95.0" y="65.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Publisher A</text><text x="95.0" y="81.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">100 Hz · IMU</text><rect x="20.0" y="140.0" width="150.0" height="56.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="95.0" y="165.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Publisher B</text><text x="95.0" y="181.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">10 Hz · GPS</text><rect x="250.0" y="70.0" width="140.0" height="110.0" rx="6" fill="#d6e8ee" stroke="#0b5d73" stroke-width="2.2" /><text x="320.0" y="100.0" font-size="12" font-weight="800" text-anchor="middle" fill="#0b5d73">TOPIC</text><text x="320.0" y="122.0" font-size="15" font-weight="800" text-anchor="middle" fill="#111">/state</text><text x="320.0" y="146.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">type + QoS contract</text><line x1="170.0" y1="68.0" x2="250.0" y2="100.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><line x1="170.0" y1="168.0" x2="250.0" y2="150.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><line x1="390.0" y1="125.0" x2="470.0" y2="56.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><rect x="470.0" y="20.0" width="270.0" height="82.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="480.0" y="40.0" font-size="13.5" font-weight="800" text-anchor="start" fill="#111">Control</text><text x="480.0" y="58.0" font-size="12" font-weight="700" text-anchor="start" fill="#0b5d73">reliable · keep-last 10</text><text x="480.0" y="75.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#444">must not lose; bounded latency</text><rect x="480.0" y="82.0" width="18.0" height="14.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1" /><rect x="502.0" y="82.0" width="18.0" height="14.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1" /><rect x="524.0" y="82.0" width="18.0" height="14.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1" /><rect x="546.0" y="82.0" width="18.0" height="14.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1" /><rect x="568.0" y="82.0" width="18.0" height="14.0" rx="0" fill="#fff" stroke="#111" stroke-width="1" /><text x="600.0" y="94.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#444">← its own queue</text><line x1="390.0" y1="125.0" x2="470.0" y2="156.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><rect x="470.0" y="120.0" width="270.0" height="82.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="480.0" y="140.0" font-size="13.5" font-weight="800" text-anchor="start" fill="#111">Display</text><text x="480.0" y="158.0" font-size="12" font-weight="700" text-anchor="start" fill="#0b5d73">best-effort · keep-last 1</text><text x="480.0" y="175.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#444">latest only; loss is fine</text><rect x="480.0" y="182.0" width="18.0" height="14.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1" /><rect x="502.0" y="182.0" width="18.0" height="14.0" rx="0" fill="#fff" stroke="#111" stroke-width="1" /><rect x="524.0" y="182.0" width="18.0" height="14.0" rx="0" fill="#fff" stroke="#111" stroke-width="1" /><rect x="546.0" y="182.0" width="18.0" height="14.0" rx="0" fill="#fff" stroke="#111" stroke-width="1" /><rect x="568.0" y="182.0" width="18.0" height="14.0" rx="0" fill="#fff" stroke="#111" stroke-width="1" /><text x="600.0" y="194.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#444">← its own queue</text><line x1="390.0" y1="125.0" x2="470.0" y2="256.0" stroke="#111" stroke-width="1.8" marker-end="url(#arr)"/><rect x="470.0" y="220.0" width="270.0" height="82.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="480.0" y="240.0" font-size="13.5" font-weight="800" text-anchor="start" fill="#111">Logger (late join)</text><text x="480.0" y="258.0" font-size="12" font-weight="700" text-anchor="start" fill="#0b5d73">reliable · transient-local</text><text x="480.0" y="275.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#444">gets last value on start</text><rect x="480.0" y="282.0" width="18.0" height="14.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1" /><rect x="502.0" y="282.0" width="18.0" height="14.0" rx="0" fill="#fff" stroke="#111" stroke-width="1" /><rect x="524.0" y="282.0" width="18.0" height="14.0" rx="0" fill="#fff" stroke="#111" stroke-width="1" /><rect x="546.0" y="282.0" width="18.0" height="14.0" rx="0" fill="#fff" stroke="#111" stroke-width="1" /><rect x="568.0" y="282.0" width="18.0" height="14.0" rx="0" fill="#fff" stroke="#111" stroke-width="1" /><text x="600.0" y="294.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#444">← its own queue</text><text x="20.0" y="318.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#444">Each arrow has a rate, a queue depth, a loss policy and an age limit — requirements, even when nobody wrote them down.</text></svg>