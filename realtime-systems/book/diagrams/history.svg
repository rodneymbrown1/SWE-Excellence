"#888" stroke-width="1"/><text x="690.0" y="66.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0b5d73">2024</text><text x="690.0" y="52.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">PREEMPT_RT</text><text x="690.0" y="38.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">mainline Linux 6.12</text><text x="30.0" y="238.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#444">Dates: interrupts per Smotherman; others per the papers and reports in research/01. Product release years are omitted (not verified).</text></svg>