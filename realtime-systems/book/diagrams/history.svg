<svg viewBox="0 0 760 250" role="img" aria-labelledby="hist-t hist-d" xmlns="http://www.w3.org/2000/svg"><title id="hist-t">Timeline: from the polling loop to today's frameworks</title><desc id="hist-d">A horizontal timeline with milestones: 1950s interrupts, 1960s Apollo executive and semaphores, 1973 Liu and Layland, 1990 priority inheritance, 1997 Pathfinder, 2008 WCET survey, 2024 PREEMPT_RT in Linux 6.12.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><line x1="30.0" y1="120.0" x2="730.0" y2="120.0" stroke="#111" stroke-width="2.5"/><rect x="54.0" y="114.0" width="12.0" height="12.0" rx="6" fill="#0b5d73" stroke="#111" stroke-width="1.6" /><line x1="60.0" y1="126.0" x2="60.0" y2="160.0" stroke="#888" stroke-width="1"/><text x="60.0" y="178.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0b5d73">1954–57</text><text x="60.0" y="194.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">interrupts appear</text><text x="60.0" y="208.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">DYSEAC, 1103A, TX-2</text><rect x="144.0" y="114.0" width="12.0" height="12.0" rx="6" fill="#0b5d73" stroke="#111" stroke-width="1.6" /><line x1="150.0" y1="114.0" x2="150.0" y2="78.0" stroke="#888" stroke-width="1"/><text x="150.0" y="66.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0b5d73">mid-1960s</text><text x="150.0" y="52.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">Apollo Executive</text><text x="150.0" y="38.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">priority jobs + Waitlist</text><rect x="244.0" y="114.0" width="12.0" height="12.0" rx="6" fill="#0b5d73" stroke="#111" stroke-width="1.6" /><line x1="250.0" y1="126.0" x2="250.0" y2="160.0" stroke="#888" stroke-width="1"/><text x="250.0" y="178.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0b5d73">1973</text><text x="250.0" y="194.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">Liu &amp; Layland</text><text x="250.0" y="208.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">RM / EDF bounds</text><rect x="344.0" y="114.0" width="12.0" height="12.0" rx="6" fill="#0b5d73" stroke="#111" stroke-width="1.6" /><line x1="350.0" y1="114.0" x2="350.0" y2="78.0" stroke="#888" stroke-width="1"/><text x="350.0" y="66.0" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0b5d73">1990</text><text 