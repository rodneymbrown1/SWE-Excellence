<svg viewBox="0 0 760 240" role="img" aria-labelledby="loop-t loop-d" xmlns="http://www.w3.org/2000/svg"><title id="loop-t">A super-loop's period is the sum of whatever it did</title><desc id="loop-d">Three iterations of a loop. Each runs read, compute, write; the third also takes a rare branch and is almost twice as long, so the period varies.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><text x="20.0" y="24.0" font-size="13" font-weight="700" text-anchor="start" fill="#111">One program, no scheduler: the period is whatever the code takes.</text><rect x="40.0" y="50.0" width="50.0" height="40.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="65.0" y="75.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">read</text><rect x="90.0" y="50.0" width="90.0" height="40.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1.6" /><text x="135.0" y="75.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">compute</text><rect x="180.0" y="50.0" width="40.0" height="40.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="200.0" y="75.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">write</text><line x1="42.0" y1="106.0" x2="218.0" y2="106.0" stroke="#0b5d73" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="130.0" y="126.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0b5d73">period 1 = 45 ms</text><rect x="220.0" y="50.0" width="50.0" height="40.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="245.0" y="75.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">read</text><rect x="270.0" y="50.0" width="90.0" height="40.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1.6" /><text x="315.0" y="75.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">compute</text><rect x="360.0" y="50.0" width="40.0" height="40.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="380.0" y="75.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">write</text><line x1="222.0" y1="106.0" x2="398.0" y2="106.0" stroke="#0b5d73" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="310.0" y="126.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0b5d73">period 2 = 45 ms</text><rect x="400.0" y="50.0" width="50.0" height="40.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="425.0" y="75.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">read</text><rect x="450.0" y="50.0" width="90.0" height="40.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1.6" /><text x="495.0" y="75.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">compute</text><rect x="540.0" y="50.0" width="40.0" height="40.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="560.0" y="75.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">write</text><rect x="580.0" y="50.0" width="170.0" height="40.0" rx="0" fill="url(#hatch)" stroke="#111" stroke-width="1.6" /><rect x="602.0" y="61.0" width="126.0" height="18.0" rx="0" fill="#fff" stroke="#111" stroke-width="1" /><text x="665.0" y="74.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111">rare branch</text><line x1="402.0" y1="106.0" x2="748.0" y2="106.0" stroke="#0b5d73" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="575.0" y="126.0" font-size="12" font-weight="700" text-anchor="middle" fill="#0b5d73">period 3 = 87 ms</text><text x="40.0" y="165.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#111">A deadline of 'every 45 ms' is met twice and missed once. Nothing in the code says so.</text><text x="40.0" y="188.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#444">Fixes seen later: a hardware timer sets the period (ch. 3), work is split into slots (ch. 5), or a scheduler preempts (ch. 6–7).</text><text x="40.0" y="224.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#444">Scale: 4 px = 1 ms.</text></svg>