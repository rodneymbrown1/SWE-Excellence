<svg viewBox="0 0 760 360" role="img" aria-labelledby="tri-t tri-d" xmlns="http://www.w3.org/2000/svg"><title id="tri-t">Symptom to first probe</title><desc id="tri-d">A table-like decision chart: for each symptom, the first suspicion and the first probe. Missed deadline: check budget and priorities with trace. Hang: check blocked tasks and watchdog. Reset loop: read reset reason. Wrong data: check shared state. Data loss: check queue drop counters.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><rect x="10.0" y="10.0" width="740.0" height="30.0" rx="4" fill="#111" stroke="#111" stroke-width="1" /><text x="20.0" y="30.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#fff">Symptom</text><text x="260.0" y="30.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#fff">First suspicion</text><text x="500.0" y="30.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#fff">First probe</text><rect x="10.0" y="40.0" width="740.0" height="44.0" rx="0" fill="#fff" stroke="#999" stroke-width="1" /><text x="20.0" y="67.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#111">Missed deadline / jitter</text><text x="260.0" y="67.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">overrun, preemption, ISR load, inversion</text><text x="500.0" y="67.0" font-size="12" font-weight="700" text-anchor="start" fill="#0b5d73">trace the window; compare R to budget</text><rect x="10.0" y="84.0" width="740.0" height="44.0" rx="0" fill="#f1f1f1" stroke="#999" stroke-width="1" /><text x="20.0" y="111.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#111">System alive, one function dead</text><text x="260.0" y="111.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">task blocked forever (lock, queue)</text><text x="500.0" y="111.0" font-size="12" font-weight="700" text-anchor="start" fill="#0b5d73">list tasks + what each waits on</text><rect x="10.0" y="128.0" width="740.0" height="44.0" rx="0" fill="#fff" stroke="#999" stroke-width="1" /><text x="20.0" y="155.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#111">Resets / reboot loop</text><text x="260.0" y="155.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">watchdog, fault, boot-time resource</text><text x="500.0" y="155.0" font-size="12" font-weight="700" text-anchor="start" fill="#0b5d73">read reset reason + saved post-mortem</text><rect x="10.0" y="172.0" width="740.0" height="44.0" rx="0" fill="#f1f1f1" stroke="#999" stroke-width="1" /><text x="20.0" y="199.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#111">Wrong or inconsistent values</text><text x="260.0" y="199.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">race on shared state, stale data</text><text x="500.0" y="199.0" font-size="12" font-weight="700" text-anchor="start" fill="#0b5d73">invariant check; watch the variable</text><rect x="10.0" y="216.0" width="740.0" height="44.0" rx="0" fill="#fff" stroke="#999" stroke-width="1" /><text x="20.0" y="243.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#111">Messages missing / late</text><text x="260.0" y="243.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">queue full, consumer starved, QoS</text><text x="500.0" y="243.0" font-size="12" font-weight="700" text-anchor="start" fill="#0b5d73">drop counters, queue depth, age stamps</text><rect x="10.0" y="260.0" width="740.0" height="44.0" rx="0" fill="#f1f1f1" stroke="#999" stroke-width="1" /><text x="20.0" y="287.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#111">Slowly gets worse over hours</text><text x="260.0" y="287.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">leak, fragmentation, counter wrap, drift</text><text x="500.0" y="287.0" font-size="12" font-weight="700" text-anchor="start" fill="#0b5d73">min-ever-free heap, high-water marks, uptime math</text><rect x="10.0" y="304.0" width="740.0" height="44.0" rx="0" fill="#fff" stroke="#999" stroke-width="1" /><text x="20.0" y="331.0" font-size="12.5" font-weight="800" text-anchor="start" fill="#111">Works in debug, fails in release</text><text x="260.0" y="331.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">timing/optimisation, uninitialised data</text><text x="500.0" y="331.0" font-size="12" font-weight="700" text-anchor="start" fill="#0b5d73">trace instead of breakpoints; build flags diff</text></svg>