<svg viewBox="0 0 760 410" role="img" aria-labelledby="six-t six-d" xmlns="http://www.w3.org/2000/svg"><title id="six-t">The six questions</title><desc id="six-d">A component in the centre surrounded by six boxes, each a topic and the engineering question it asks: Timing, Scheduling, Messaging, Synchronization, Reliability, Observability.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><rect x="300.0" y="160.0" width="160.0" height="90.0" rx="4" fill="#d6e8ee" stroke="#0b5d73" stroke-width="2.4" /><text x="380.0" y="202.0" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Your component</text><text x="380.0" y="218.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">period · deadline · budget</text><rect x="8.0" y="14.0" width="214.0" height="92.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="18.0" y="38.0" font-size="15" font-weight="800" text-anchor="start" fill="#111">1  Timing</text><text x="18.0" y="62.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">Can it finish on time?</text><text x="18.0" y="84.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">period, deadline, WCET, jitter</text><rect x="273.0" y="6.0" width="214.0" height="92.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="283.0" y="30.0" font-size="15" font-weight="800" text-anchor="start" fill="#111">2  Scheduling</text><text x="283.0" y="54.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">Which runs first?</text><text x="283.0" y="76.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">priority, preemption, RM / EDF</text><rect x="538.0" y="14.0" width="214.0" height="92.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="548.0" y="38.0" font-size="15" font-weight="800" text-anchor="start" fill="#111">3  Messaging</text><text x="548.0" y="62.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">What if messages come too fast?</text><text x="548.0" y="84.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">queues, pub/sub, QoS, backpressure</text><rect x="8.0" y="304.0" width="214.0" height="92.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="18.0" y="328.0" font-size="15" font-weight="800" text-anchor="start" fill="#111">4  Synchronization</text><text x="18.0" y="352.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">Can they share data safely?</text><text x="18.0" y="374.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">races, locks, inversion, deadlock</text><rect x="273.0" y="312.0" width="214.0" height="92.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="283.0" y="336.0" font-size="15" font-weight="800" text-anchor="start" fill="#111">5  Reliability</text><text x="283.0" y="360.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">What if a component stops?</text><text x="283.0" y="382.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">watchdog, containment, recovery</text><rect x="538.0" y="304.0" width="214.0" height="92.0" rx="4" fill="#fff" stroke="#111" stroke-width="1.8" /><text x="548.0" y="328.0" font-size="15" font-weight="800" text-anchor="start" fill="#111">6  Observability</text><text x="548.0" y="352.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">How do I prove it meets the need?</text><text x="548.0" y="374.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">trace, histogram, budget vs measured</text><line x1="222.0" y1="90.0" x2="306.0" y2="170.0" stroke="#0b5d73" stroke-width="1.6" marker-end="url(#arrA)"/><line x1="380.0" y1="98.0" x2="380.0" y2="160.0" stroke="#0b5d73" stroke-width="1.6" marker-end="url(#arrA)"/><line x1="538.0" y1="90.0" x2="454.0" y2="170.0" stroke="#0b5d73" stroke-width="1.6" marker-end="url(#arrA)"/><line x1="222.0" y1="312.0" x2="306.0" y2="240.0" stroke="#0b5d73" stroke-width="1.6" marker-end="url(#arrA)"/><line x1="380.0" y1="312.0" x2="380.0" y2="250.0" stroke="#0b5d73" stroke-width="1.6" marker-end="url(#arrA)"/><line x1="538.0" y1="312.0" x2="454.0" y2="240.0" stroke="#0b5d73" stroke-width="1.6" marker-end="url(#arrA)"/></svg>