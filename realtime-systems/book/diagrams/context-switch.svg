<svg viewBox="0 0 760 300" role="img" aria-labelledby="ctx-t ctx-d" xmlns="http://www.w3.org/2000/svg"><title id="ctx-t">A context switch</title><desc id="ctx-d">Task A is running; the SysTick interrupt makes the kernel pick task B; PendSV saves A's registers on A's stack, loads B's, and B resumes. Each task owns a stack.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><text x="20.0" y="22.0" font-size="13" font-weight="700" text-anchor="start" fill="#111">One CPU, many stacks: the kernel swaps which stack the CPU is using.</text><rect x="30.0" y="50.0" width="310.0" height="30.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="40.0" y="70.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">time →</text><rect x="30.0" y="90.0" width="150.0" height="40.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1.6" /><text x="105.0" y="115.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">Task A runs</text><rect x="180.0" y="90.0" width="30.0" height="40.0" rx="0" fill="#0b5d73" stroke="#111" stroke-width="1.6" /><text x="195.0" y="82.0" font-size="10.5" font-weight="700" text-anchor="middle" fill="#0b5d73">SysTick</text><rect x="210.0" y="90.0" width="50.0" height="40.0" rx="0" fill="#d6e8ee" stroke="#0b5d73" stroke-width="1.6" /><text x="235.0" y="115.0" font-size="11" font-weight="700" text-anchor="middle" fill="#0b5d73">PendSV</text><rect x="260.0" y="90.0" width="140.0" height="40.0" rx="0" fill="url(#dots)" stroke="#111" stroke-width="1.6" /><rect x="275.0" y="100.0" width="110.0" height="20.0" rx="0" fill="#fff" stroke="#111" stroke-width="1" /><text x="330.0" y="115.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111">Task B runs</text><text x="30.0" y="160.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">1. SysTick: tick count++, a delayed task (B) becomes ready, B outranks A</text><text x="30.0" y="180.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">2. PendSV (lowest-priority exception) runs the switch after other interrupts finish</text><text x="30.0" y="200.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">3. Save A's registers on A's stack  →  store A's stack pointer in A's TCB</text><text x="30.0" y="220.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">4. Load B's stack pointer from B's TCB  →  restore B's registers  →  return to B</text><rect x="470.0" y="60.0" width="120.0" height="150.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="530.0" y="78.0" font-size="12" font-weight="800" text-anchor="middle" fill="#111">RAM</text><rect x="480.0" y="90.0" width="100.0" height="48.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1.4" /><text x="530.0" y="108.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111">stack A</text><text x="530.0" y="124.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">saved regs</text><rect x="480.0" y="146.0" width="100.0" height="48.0" rx="0" fill="url(#dots)" stroke="#111" stroke-width="1.4" /><rect x="490.0" y="158.0" width="80.0" height="24.0" rx="0" fill="#fff" stroke="#111" stroke-width="1" /><text x="530.0" y="175.0" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111">stack B</text><rect x="610.0" y="90.0" width="120.0" height="44.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.4" /><text x="670.0" y="108.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">TCB A</text><text x="670.0" y="125.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">saved SP, prio</text><rect x="610.0" y="146.0" width="120.0" height="44.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.4" /><text x="670.0" y="164.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">TCB B</text><text x="670.0" y="181.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#444">saved SP, prio</text><line x1="610.0" y1="112.0" x2="580.0" y2="112.0" stroke="#0b5d73" stroke-width="1.4" marker-end="url(#arrA)"/><line x1="610.0" y1="168.0" x2="580.0" y2="168.0" stroke="#0b5d73" stroke-width="1.4" marker-end="url(#arrA)"/><text x="30.0" y="262.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#444">Cost: tens of microseconds of CPU on an MCU, every switch. Frequent preemption is not free (R2 measured 4–24 µs per wake-up).</text><text x="30.0" y="282.0" font-size="10.5" font-weight="400" text-anchor="start" fill="#444">Model: FreeRTOS on Cortex-M (SysTick + PendSV); see Memfault 'RTOS context switching on Cortex-M'.</text></svg>