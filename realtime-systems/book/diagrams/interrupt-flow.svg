<svg viewBox="0 0 760 300" role="img" aria-labelledby="irq-t irq-d" xmlns="http://www.w3.org/2000/svg"><title id="irq-t">Interrupts and deferred work</title><desc id="irq-d">A main program running, an interrupt arriving, the interrupt handler doing the minimum and posting an event to a queue, then a task doing the long work later.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><text x="20.0" y="22.0" font-size="13" font-weight="700" text-anchor="start" fill="#111">Do the minimum in the interrupt; hand the rest to a task.</text><rect x="30.0" y="60.0" width="700.0" height="36.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="40.0" y="83.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">Task (low priority)</text><rect x="190.0" y="60.0" width="150.0" height="36.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1.6" /><text x="265.0" y="83.0" font-size="12" font-weight="400" text-anchor="middle" fill="#111">running…</text><rect x="430.0" y="60.0" width="120.0" height="36.0" rx="0" fill="#d9d9d9" stroke="#111" stroke-width="1.6" /><text x="490.0" y="83.0" font-size="12" font-weight="400" text-anchor="middle" fill="#111">…resumes</text><rect x="340.0" y="60.0" width="90.0" height="36.0" rx="0" fill="url(#hatch)" stroke="#111" stroke-width="1.6" /><rect x="30.0" y="140.0" width="700.0" height="36.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="40.0" y="163.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">Interrupt</text><rect x="340.0" y="140.0" width="60.0" height="36.0" rx="0" fill="#0b5d73" stroke="#111" stroke-width="1.6" /><text x="370.0" y="163.0" font-size="12" font-weight="800" text-anchor="middle" fill="#fff">ISR</text><rect x="30.0" y="220.0" width="700.0" height="36.0" rx="0" fill="#fff" stroke="#111" stroke-width="1.6" /><text x="40.0" y="243.0" font-size="12" font-weight="700" text-anchor="start" fill="#111">Handler task (high prio)</text><rect x="400.0" y="220.0" width="140.0" height="36.0" rx="0" fill="#d6e8ee" stroke="#0b5d73" stroke-width="1.8" /><text x="470.0" y="243.0" font-size="12" font-weight="700" text-anchor="middle" fill="#111">long work</text><line x1="340.0" y1="118.0" x2="340.0" y2="140.0" stroke="#0b5d73" stroke-width="1.8" marker-end="url(#arrA)"/><text x="352.0" y="132.0" font-size="11" font-weight="700" text-anchor="start" fill="#0b5d73">event arrives</text><line x1="370.0" y1="176.0" x2="400.0" y2="220.0" stroke="#0b5d73" stroke-width="1.8" marker-end="url(#arrA)"/><text x="396.0" y="205.0" font-size="11" font-weight="700" text-anchor="start" fill="#0b5d73">post to queue</text><text x="30.0" y="280.0" font-size="12" font-weight="400" text-anchor="start" fill="#444">ISR: microseconds, no blocking, only 'FromISR' calls.   Handler task: milliseconds, may block, may be preempted.</text></svg>