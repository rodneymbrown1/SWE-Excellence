<svg viewBox="0 0 760 300" role="img" aria-labelledby="rta-t rta-d" xmlns="http://www.w3.org/2000/svg"><title id="rta-t">Response-time analysis as stacked interference</title><desc id="rta-d">Worst-case response time of task t3 built up as its own 3 ms of work plus interference from t1 (3 jobs of 1 ms) and t2 (2 jobs of 2 ms) before it can finish at 10 ms; its deadline is 12 ms.</desc><defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111" stroke-width="1.6"/></pattern>
<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1" fill="#555"/></pattern>
<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><path d="M0 0L6 6M6 0L0 6" stroke="#111" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5d73"/></marker>
</defs><text x="20.0" y="22.0" font-size="13" font-weight="700" text-anchor="start" fill="#111">t3 (C = 3, T = 12) released together with t1 (C = 1, T = 4) and t2 (C = 2, T = 6)</text><text x="20.0" y="44.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#111">R₃ = C₃ + ⌈R₃/T₁⌉·C₁ + ⌈R₃/T₂⌉·C₂      iterate:  R = 3 → 6 → 7 → 9 → 10 → 10  (converged)</text><text x="10.0" y="64.0" font-size="11" font-weight="400" text-anchor="start" fill="#444">ms</text><line x1="40.0" y1="70.0" x2="40.0" y2="200.0" stroke="#ddd" stroke-width="0.8"/><text x="40.0" y="64.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">0</text><line x1="72.5" y1="70.0" x2="72.5" y2="200.0" stroke="#ddd" stroke-width="0.8"/><text x="72.5" y="64.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">1</text><line x1="105.0" y1="70.0" x2="105.0" y2="200.0" stroke="#ddd" stroke-width="0.8"/><text x="105.0" y="64.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">2</text><line x1="137.5" y1="70.0" x2="137.5" y2="200.0" stroke="#ddd" stroke-width="0.8"/><text x="137.5" y="64.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">3</text><line x1="170.0" y1="70.0" x2="170.0" y2="200.0" stroke="#ddd" stroke-width="0.8"/><text x="170.0" y="64.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">4</text><line x1="202.5" y1="70.0" x2="202.5" y2="200.0" stroke="#ddd" stroke-width="0.8"/><text x="202.5" y="64.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">5</text><line x1="235.0" y1="70.0" x2="235.0" y2="200.0" stroke="#ddd" stroke-width="0.8"/><text x="235.0" y="64.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">6</text><line x1="267.5" y1="70.0" x2="267.5" y2="200.0" stroke="#ddd" stroke-width="0.8"/><text x="267.5" y="64.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">7</text><line x1="300.0" y1="70.0" x2="300.0" y2="200.0" stroke="#ddd" stroke-width="0.8"/><text x="300.0" y="64.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">8</text><line x1="332.5" y1="70.0" x2="332.5" y2="200.0" stroke="#ddd" stroke-width="0.8"/><text x="332.5" y="64.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">9</text><line x1="365.0" y1="70.0" x2="365.0" y2="200.0" stroke="#ddd" stroke-width="0.8"/><text x="365.0" y="64.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">10</text><line x1="397.5" y1="70.0" x2="397.5" y2="200.0" stroke="#ddd" stroke-width="0.8"/><text x="397.5" y="64.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">11</text><line x1="430.0" y1="70.0" x2="430.0" y2="200.0" stroke="#ddd" stroke-width="0.8"/><text x="430.0" y="64.0" font-size="11" font-weight="400" text-anchor="middle" fill="#444">12</text><text x="32.0" y="98.0" font-size="13" font-weight="700" text-anchor="end" fill="#111">t1</text><rect x="40.0" y="78.0" width="32.5" height="28.0" rx="0" fill="#111" stroke="#fff" stroke-width="1" /><rect x="170.0" y="78.0" width="32.5" height="28.0" rx="0" fill="#111" stroke="#fff" stroke-width="1" /><rect x="300.0" y="78.0" width="32.5" height="28.0" rx="0" fill="#111" stroke="#fff" stroke-width="1" /><text x="32.0" y="136.0" font-size="13" font-weight="700" text-anchor="end" fill="#111">t2</text><rect x="72.5" y="116.0" width="65.0" height="28.0" rx="0" fill="#a8a8a8" stroke="#fff" stroke-width="1" /><rect x="235.0" y="116.0" width="65.0" height="28.0" rx="0" fill="#a8a8a8" stroke="#fff" stroke-width="1" /><text x="32.0" y="174.0" font-size="13" font-weight="700" text-anchor="end" fill="#111">t3</text><rect x="137.5" y="154.0" width="32.5" height="28.0" rx="0" fill="#0b5d73" stroke="#fff" stroke-width="1" /><rect x="202.5" y="154.0" width="32.5" height="28.0" rx="0" fill="#0b5d73" stroke="#fff" stroke-width="1" /><rect x="332.5" y="154.0" width="32.5" height="28.0" rx="0" fill="#0b5d73" stroke="#fff" stroke-width="1" /><line x1="430.0" y1="70.0" x2="430.0" y2="200.0" stroke="#b00020" stroke-width="2" stroke-dasharray="5 3"/><text x="434.0" y="212.0" font-size="11.5" font-weight="700" text-anchor="start" fill="#b00020">deadline 12</text><line x1="365.0" y1="160.0" x2="365.0" y2="200.0" stroke="#0b5d73" stroke-width="2"/><text x="369.0" y="226.0" font-size="12" font-weight="800" text-anchor="start" fill="#0b5d73">R₃ = 10</text><text x="20.0" y="262.0" font-size="12" font-weight="400" text-anchor="start" fill="#111">Dark: t1.  Mid-gray: t2.  Teal: t3 — it only runs in the gaps (ms 3, 5, 9).  Slack = 12 − 10 = 2 ms.</text><text x="20.0" y="282.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#444">Utilization here is 0.833 — above the 0.780 bound — yet the exact test proves it schedulable. (Lab H3, demo 1.)</text></svg>